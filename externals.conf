# The externals of the project: the software the build and the distributions need, none of it under source
# control. scripts/linux/setup.sh (Linux) / scripts\windows\setup.bat (Windows) download these into external/ and deploy them
# under generic names, the only ones the scripts and the build know:
#   external/jdk                 the JDK that compiles and runs the server (the scripts' JAVA_HOME)
#   external/maven               Maven, which builds the whole project
#   external/node                Node.js and npm, which build the page (run by Maven: jtools-parent, profile
#                                jtools-frontend)
#   external/jdk-linux.tar.gz    the JDK above as its archive, whose jlink links the distributions' runtimes
#   external/jmods-linux.tar.gz  the jmods each platform's runtime is linked from (scripts/linux/package.sh), of the
#   external/jmods-windows.zip   JDK's version; a platform this file names no JMODS_* for has no distribution
#   external/jmods-macos.tar.gz  (JMODS_MACOS: Apple silicon)
#   external/downloads/          the archives as downloaded, kept so that a second run downloads nothing
# The versions live here and nowhere else. A tool this file does not name is not deployed: a project without a page
# drops NODE_*, a project that wants Gradle adds GRADLE=<its distribution's URL> (scripts/linux/setup.sh then deploys it
# in external/gradle). This file is the devkit's default: jtools new copies it, scripts/linux/jtools sync compares with it.
#
# MIRROR: a local Artifactory (any HTTP folder) holding the same file names, fetched as <MIRROR>/<file name>
# instead of the URLs below; empty, the URLs are used. When the mirror wants authentication:
#   MIRROR_TOKEN          sent with every download from the mirror in the header MIRROR_TOKEN_HEADER, which is
#                         "Authorization: Bearer" by default (an Artifactory access token) — "X-JFrog-Art-Api:"
#                         for an Artifactory API key, any "Name:" the mirror expects
#   MIRROR_USER, MIRROR_PASSWORD   basic authentication instead (a user and its password or API key)
# Keep secrets out of this file: put them in externals.local.conf next to it (same syntax, not under source
# control) or in the environment. The environment wins over externals.local.conf, which wins over this file.
MIRROR=
MIRROR_TOKEN=
MIRROR_TOKEN_HEADER=Authorization: Bearer
MIRROR_USER=
MIRROR_PASSWORD=
JDK_LINUX=https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.5%2B8/OpenJDK25U-jdk_x64_linux_hotspot_25.0.5_8.tar.gz
JDK_WINDOWS=https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.5%2B8/OpenJDK25U-jdk_x64_windows_hotspot_25.0.5_8.zip
MAVEN_LINUX=https://archive.apache.org/dist/maven/maven-3/3.9.12/binaries/apache-maven-3.9.12-bin.tar.gz
MAVEN_WINDOWS=https://archive.apache.org/dist/maven/maven-3/3.9.12/binaries/apache-maven-3.9.12-bin.zip
# Node.js, an LTS line the Angular CLI supports (see its "engines" in frontend/package-lock.json)
NODE_LINUX=https://nodejs.org/dist/v24.21.0/node-v24.21.0-linux-x64.tar.gz
NODE_WINDOWS=https://nodejs.org/dist/v24.21.0/node-v24.21.0-win-x64.zip
# The jmods each distribution's runtime is linked from (jlink), one archive per platform, of the JDK's version: a JDK
# from 24 on carries none of its own, Temurin publishes them apart. A platform whose JMODS_* is absent is not built.
JMODS_LINUX=https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.5%2B8/OpenJDK25U-jmods_x64_linux_hotspot_25.0.5_8.tar.gz
JMODS_WINDOWS=https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.5%2B8/OpenJDK25U-jmods_x64_windows_hotspot_25.0.5_8.zip
JMODS_MACOS=https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.5%2B8/OpenJDK25U-jmods_aarch64_mac_hotspot_25.0.5_8.tar.gz
