# A pushed tag vX.Y.Z publishes the release: the trimmed runtimes (jlink, from the jmods externals.conf names),
# the archives, the notes from CHANGELOG.md's "## X.Y.Z" section, the checksums. The by-hand way
# is scripts/linux/package.sh then scripts/release.sh (see PUBLISHING.md, section 5).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check that the tag matches the pom
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "<version>$version</version>" pom.xml || { echo "pom.xml is not at version $version"; exit 1; }
          scripts/changelog-section.py "$version" > /dev/null

      - name: The externals externals.conf names (the JDK, Maven, Node.js, the jmods)
        run: scripts/linux/setup.sh

      - name: Build and test, then package
        run: scripts/linux/package.sh -B --no-transfer-progress

      - name: Release notes
        run: scripts/release.sh --body "${GITHUB_REF_NAME#v}" > body.md && cat body.md

      - name: Create the release with the archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --title "XsdViewer $version" --notes-file body.md \
            "releases/xsdviewer-$version.jar" "releases/xsdviewer-$version-windows.zip" \
            "releases/xsdviewer-$version-linux.tar.gz" "releases/xsdviewer-$version-macos.tar.gz"
