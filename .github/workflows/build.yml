# Build and test on every push and pull request: JDK 21 + Maven, then keep the jar
# as a workflow artefact (the distributions with a bundled JRE are built locally by
# scripts/package.sh, see README: Packaging).
name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B --no-transfer-progress package

      - name: Keep the jar
        uses: actions/upload-artifact@v4
        with:
          name: xsdviewer.jar
          path: target/xsdviewer.jar
          if-no-files-found: error
