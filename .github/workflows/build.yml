# Build and test on every push and pull request: JDK 25 + Maven, then keep the jar
# as a workflow artefact (the distributions with a bundled JRE are built locally by
# scripts/package.sh, see README: Packaging).
name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/setup-node@v5   # the tests of the page (app/src/test/js) run under Node from Maven
        with:
          node-version: '22'

      - name: Build and test
        run: mvn -B --no-transfer-progress package

      - name: Keep the jar
        uses: actions/upload-artifact@v6
        with:
          name: xsdviewer.jar
          path: app/target/xsdviewer.jar
          if-no-files-found: error
