# XsdViewer configuration
#
# This file sets the defaults the program starts with. It is read from the folder the
# launcher runs in (for XsdViewer.exe, the folder the exe sits in), so you can configure
# the double-clicked launcher here without a command line. A command-line option of the
# same name (for example --port) still overrides what is set here.
#
# Uncomment a line (remove the leading #) to change a value.

# The port the server listens on. Default: 8091.
#port=8091

# The address the server binds to. 127.0.0.1 means this machine only;
# 0.0.0.0 lets other computers on the network reach it. Default: 127.0.0.1.
#host=127.0.0.1

# The log tells what happens to the server and what fails. true adds every request
# and every parse, as --verbose does. Default: false.
#verbose=false

# The folder of the log files: xsdviewer.0.log, and xsdviewer.1.log once the first
# reaches 1 MB. A relative folder is taken from the folder the program runs in;
# "none" keeps the log on the console only. Default: the temporary directory.
#log.folder=none
